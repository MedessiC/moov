<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Cercle de fond arrondi bleu nuit -->
  <circle cx="128" cy="128" r="128" fill="#191970"/>
  
  <!-- Cercle doré interne -->
  <circle cx="128" cy="128" r="115" fill="none" stroke="#FFD700" stroke-width="4"/>
  
  <!-- Lettre M (Or/Jaune) -->
  <text x="128" y="155" font-family="Montserrat, sans-serif" font-size="140" font-weight="700" fill="#FFD700" text-anchor="middle" dominant-baseline="middle">
    M
  </text>
  
  <!-- Petit point doré en bas pour accent -->
  <circle cx="128" cy="190" r="5" fill="#FFD700"/>
</svg>
